syntax = "proto3";
option go_package = "github.com/hoangNguyenDev3/WanderSphere/backend/pkg/types/proto/pb/newsfeed;newsfeed";
package newsfeed;

service Newsfeed {
    rpc GetNewsfeed(GetNewsfeedRequest) returns (GetNewsfeedResponse) {}
    rpc InvalidateCache(InvalidateCacheRequest) returns (InvalidateCacheResponse) {}
}

message GetNewsfeedRequest {
    int64 user_id = 1;
    int32 page = 2;        // deprecated, kept for backward compat
    int32 page_size = 3;   // also used as limit for cursor pagination
    string cursor = 4;     // base64-encoded cursor; empty = first page
}

message GetNewsfeedResponse {
    enum GetNewsfeedStatus {
        OK = 0;
        NEWSFEED_EMPTY = 1;
    }
    GetNewsfeedStatus status = 1;
    repeated int64 posts_ids = 2;
    int32 total_pages = 3;      // deprecated for cursor mode
    int32 current_page = 4;     // deprecated for cursor mode
    int32 total_items = 5;
    string next_cursor = 6;     // empty = no more results
    bool has_more = 7;
}

message InvalidateCacheRequest {
    int64 post_id = 1;
    bool is_deleted = 2;
}

message InvalidateCacheResponse {
    enum InvalidateCacheStatus {
        OK = 0;
        ERROR = 1;
    }
    InvalidateCacheStatus status = 1;
}